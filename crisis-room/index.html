<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ห้องวิกฤต</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;600&family=Sarabun:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: a watch room at night. A status bar across the top, then three stations: readiness on the left,
   the situation map and live feed in the middle, the command desk on the right. Chart conventions carry over:
   a graticule, magenta for annotations, graduated scale bars for time and meters. */
:root{
  --bg:#09131E; --panel:#0F1D2B; --raise:#16293B; --line:#27425C; --ink:#DCE8F0; --ink-2:#8FA6B8;
  --accent:#F07FBE; --accent-ink:#2A0A1C; --sig:#6FD0E6; --buff:#3A3520; --buff-ink:#F1E7BE; --seg-off:#22394F;
  --good:#58C79A; --warn:#E8AC4E; --bad:#F2766B; --land:#14283C; --sea:#0A1826;
  --h1:#5E3059; --h2:#A84C8F; --h3:#F07FBE;
  --f-display:'Chakra Petch','Noto Sans Thai','Leelawadee UI',Tahoma,sans-serif;
  --f-body:'Sarabun','Noto Sans Thai','Leelawadee UI',Tahoma,sans-serif;
  --f-data:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#E7EEF1; --panel:#F9FBFB; --raise:#EDF3F5; --line:#B3C5CF; --ink:#12263A; --ink-2:#4A5E6D;
    --accent:#A3246F; --accent-ink:#FFFFFF; --sig:#1F6F8B; --buff:#F1E6BC; --buff-ink:#3A3110; --seg-off:#CBD8DE;
    --good:#1F7A55; --warn:#8F5600; --bad:#B3261E; --land:#F3EBCB; --sea:#DCEAF0;
    --h1:#E9C6DC; --h2:#C96FA6; --h3:#A3246F; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#E7EEF1; --panel:#F9FBFB; --raise:#EDF3F5; --line:#B3C5CF; --ink:#12263A; --ink-2:#4A5E6D;
  --accent:#A3246F; --accent-ink:#FFFFFF; --sig:#1F6F8B; --buff:#F1E6BC; --buff-ink:#3A3110; --seg-off:#CBD8DE;
  --good:#1F7A55; --warn:#8F5600; --bad:#B3261E; --land:#F3EBCB; --sea:#DCEAF0;
  --h1:#E9C6DC; --h2:#C96FA6; --h3:#A3246F; color-scheme:light;
}
*{box-sizing:border-box}
html{height:100%}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.65;overflow-wrap:anywhere}
.wrap{max-width:1560px;margin-inline:auto;padding-inline:20px;padding-block:24px 64px;display:flex;flex-direction:column;gap:26px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.3;margin:0;font-weight:600}
h1{font-size:clamp(2.1rem,5vw,3.2rem);font-weight:700;letter-spacing:.01em}
h2{font-size:1.3rem}
h3{font-size:1.05rem}
p{margin:0}
a{color:var(--accent)}
.data{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:.88rem;line-height:1.5}
.eyebrow{font-family:var(--f-data);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.neat{height:8px;border-block:1.5px solid var(--ink);background:repeating-linear-gradient(90deg,var(--ink) 0 26px,transparent 26px 52px)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1.5px solid var(--ink);background:transparent;padding:.45rem 1rem;border-radius:2px;font-family:var(--f-display);font-weight:600;line-height:1.4;min-height:44px}
.btn:hover{background:var(--raise)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.quiet{border-color:var(--line);font-family:var(--f-body);font-weight:400;font-size:.88rem;padding:.3rem .7rem;min-height:40px}
.btn:disabled{opacity:.5;cursor:not-allowed}
select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:2px}
select{padding:.4rem .5rem;max-width:100%;min-height:40px}
textarea{width:100%;padding:.7rem .8rem;resize:vertical;min-height:8.5rem;line-height:1.6}
textarea:focus,select:focus{border-color:var(--accent)}
label.field{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--ink-2)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.notice{padding:10px 14px;border:1.5px solid var(--bad);background:var(--panel)}
.notice b{color:var(--bad)}

/* home */
.mast{display:flex;flex-direction:column;gap:12px}
.lede{max-width:66ch;color:var(--ink-2)}
.scn-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.scn{position:relative;display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px solid var(--line);background:var(--panel);cursor:pointer;min-width:0}
.scn input{position:absolute;opacity:0;pointer-events:none}
.scn:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--raise)}
.scn:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.scn .pick-l{font-family:var(--f-data);font-size:.7rem;letter-spacing:.1em;color:var(--ink-2)}
.scn:has(input:checked) .pick-l{color:var(--accent);font-weight:600}
.setup-cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:"brief side";gap:26px;align-items:start}
.setup-side{grid-area:side;display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.brief{grid-area:brief;display:flex;flex-direction:column;gap:14px;min-width:0}
.card{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--line);background:var(--panel)}
.facts{margin:0;padding-left:1.3rem;display:flex;flex-direction:column;gap:8px;max-width:72ch}
.facts sup a{font-family:var(--f-data);font-size:.72rem;text-decoration:none;margin-left:2px}
.trigger{background:var(--buff);color:var(--buff-ink);padding:12px 14px;border-left:4px solid var(--accent);max-width:72ch}
.trigger .eyebrow{color:var(--buff-ink);opacity:.8}
.sources{margin:0;padding-left:1.3rem;display:flex;flex-direction:column;gap:4px}
.rules{margin:0;padding-left:1.15rem;display:flex;flex-direction:column;gap:6px}
.saves{display:flex;flex-direction:column;gap:8px}
.save-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--buff);color:var(--buff-ink);border-left:4px solid var(--accent)}
.save-meta{display:flex;flex-direction:column;min-width:0}
.save-meta .small{opacity:.85}
.save-row .btn{border-color:var(--buff-ink);color:var(--buff-ink)}
.save-row .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.save-row .btn:not(.primary):hover{background:transparent;text-decoration:underline}

/* stations */
.panel{position:relative;display:flex;flex-direction:column;min-width:0;background:var(--panel);border:1px solid var(--line)}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 10px;padding:5px 12px;border-bottom:1px solid var(--line);font-family:var(--f-data);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.ph b{font-family:var(--f-display);font-size:.9rem;letter-spacing:.02em;text-transform:none;color:var(--ink);font-weight:600}
.pb{display:flex;flex-direction:column;gap:12px;padding:12px;min-width:0}
.panel.tick::before,.panel.tick::after{content:"";position:absolute;width:11px;height:11px;border:2px solid var(--accent);pointer-events:none}
.panel.tick::before{top:0;left:0;border-right:0;border-bottom:0}
.panel.tick::after{bottom:0;right:0;border-left:0;border-top:0}
.linkbtn{border:0;background:none;padding:0 .2rem;font-family:var(--f-body);font-size:.8rem;letter-spacing:0;text-transform:none;color:var(--accent);text-decoration:underline;min-height:28px}

/* game: one column with a sticky status bar by default (phone, app sheet); three stations in landscape */
.game{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;width:100%;max-width:820px;margin-inline:auto;align-items:start}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:8px 12px;background:var(--panel);border:1px solid var(--line);min-width:0}
.hud-id{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.hud-id h2{font-size:1rem}
.hud-id .eyebrow,.hud-id .role{display:none}
.hcell{display:flex;flex-direction:column;gap:1px;min-width:0}
.hcell .k{font-family:var(--f-data);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.hcell .v{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-weight:600;font-size:.9rem;white-space:nowrap}
.hcell.time .v{font-size:1.55rem;line-height:1.05}
.hcell.next .v{max-width:16rem;overflow:hidden;text-overflow:ellipsis}
.hcell.time.paused .k,.hcell.time.paused .v{color:var(--warn)}
.hud-tools{flex-wrap:wrap}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.game.is-paused .prog i{background:var(--warn)}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:40px;cursor:pointer;color:var(--ink-2)}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.hcell.next.hot .v{color:var(--bad)}
.blocks{display:flex;gap:3px;margin-top:2px}
.blocks i{width:14px;height:7px;background:var(--seg-off)}
.alert.a1 .blocks i.on,.alert.a2 .blocks i.on{background:var(--good)}
.alert.a3 .blocks i.on{background:var(--warn)}
.alert.a4 .blocks i.on,.alert.a5 .blocks i.on{background:var(--bad)}
.hud .wide-only{display:none}
.hud-tools{display:flex;gap:6px}
.hud-tools .btn{min-height:36px;padding:.15rem .55rem;font-size:.8rem}
.prog{flex:1 0 100%;height:5px;background:var(--seg-off)}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
.meters{display:grid;gap:10px}
.meters.mini{flex:1 0 100%;grid-template-columns:repeat(4,minmax(0,1fr))}
.meter{display:flex;flex-direction:column;gap:3px;min-width:0}
.meter-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 8px}
.meter-label{font-weight:600;font-size:.9rem;line-height:1.35}
.meter-short{font-weight:600;font-size:.74rem;line-height:1.3}
.meter-val{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:.78rem;color:var(--ink-2);white-space:nowrap}
.meter-val b{font-size:1.05rem;color:var(--ink)}
.segs{display:flex;gap:2px}
.segs i{flex:1;height:7px;background:var(--seg-off)}
.segs.good i.on{background:var(--good)} .segs.warn i.on{background:var(--warn)} .segs.bad i.on{background:var(--bad)}
.meter-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.76rem;color:var(--ink-2);line-height:1.35}
.state b{font-weight:600;color:var(--ink)}
.state .mk-s{margin-right:4px}
.state.good .mk-s{color:var(--good)} .state.warn .mk-s{color:var(--warn)} .state.bad .mk-s{color:var(--bad)}
.spark{width:92px;height:22px;flex:none}
.spark polyline{fill:none;stroke:var(--ink-2);stroke-width:1.5;vector-effect:non-scaling-stroke}
.spark circle{fill:var(--ink)}

.statcol,.midcol,.desk{display:flex;flex-direction:column;gap:12px;min-width:0}
.midcol{order:1}.statcol{order:2}
.game[data-tab="sit"] .midcol{padding-bottom:0}
.game[data-tab="feed"] .statcol,.game[data-tab="feed"] .mappanel{display:none}
.game[data-tab="sit"] .feedpanel{display:none}
.statcol,.midcol{padding-bottom:84px}
.game[data-tab="feed"] .statcol{padding-bottom:0}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bt{display:flex;flex-direction:column;gap:3px;font-size:.82rem;line-height:1.35;min-width:0}
.bt b{font-weight:600}
.pips{display:flex;gap:2px}
.pips i{flex:1;height:6px;background:var(--seg-off)}
.bt.l1 .pips i.on{background:var(--warn)} .bt.l2 .pips i.on,.bt.l3 .pips i.on{background:var(--bad)}
.toll{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.88rem}
.toll b{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;margin:0;font-size:.88rem;line-height:1.45}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;font-family:var(--f-data);font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.blind{font-size:.88rem;line-height:1.5}
.blind b{color:var(--warn)}
.sit{display:flex;flex-direction:column;gap:8px;font-size:.9rem;line-height:1.55}
.sit h4{margin:0;font-family:var(--f-data);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:400}
.sit ul{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:3px}
details.base>summary{cursor:pointer;font-weight:600;font-size:.9rem}
details.base .facts{font-size:.84rem;line-height:1.5;margin-top:8px}
.rail-actions{display:flex;flex-direction:row;flex-wrap:wrap;gap:8px}

/* situation map and tempo strip */
.maprow{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:10px 12px}
.mapbox{min-width:0}
.mapsvg{display:block;width:100%;height:auto;max-height:420px;background:var(--sea);border:1px solid var(--line)}
.mapsvg .land{fill:var(--land);stroke:var(--line);stroke-width:.8}
.mapsvg .land.th{fill:color-mix(in srgb, var(--sig) 15%, var(--land))}
.mapsvg .land.op{fill:color-mix(in srgb, var(--accent) 15%, var(--land))}
.fr{display:grid;grid-template-columns:minmax(0,1fr) 9.4rem minmax(0,1fr);gap:6px;align-items:baseline;font-size:.84rem;padding:2px 0;border-bottom:1px dashed var(--line)}
.fr .fl{text-align:center;color:var(--ink-2);line-height:1.25}
.fr .fv{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.fr .fv.r{text-align:right}
.fr .lost{color:var(--bad)}
.cmp{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:.84rem;line-height:1.45}
.bal-r.lowstock b{color:var(--warn)}
.bal-r b{white-space:nowrap}
.bal-r b:last-child{text-align:right}
.wo-r.joined .wo-l{font-weight:700}
.mapsvg .obj rect{stroke:var(--bg);stroke-width:2.5}
.mapsvg .obj.th rect{fill:var(--sig)} .mapsvg .obj.op rect{fill:var(--accent)} .mapsvg .obj.contested rect{fill:var(--warn)}
.mapsvg .obj .ol{fill:var(--ink);font-family:var(--f-body);font-size:18px;paint-order:stroke;stroke:var(--land);stroke-width:5px;stroke-linejoin:round}
.legend i.lg-obj{width:9px;height:9px;transform:rotate(45deg);margin-left:4px}
.legend i.lg-obj.th,.fl-r .sw.th{background:var(--sig)} .legend i.lg-obj.op,.fl-r .sw.op{background:var(--accent)} .legend i.lg-obj.contested,.fl-r .sw.contested{background:var(--warn)}
.fl-r{display:grid;grid-template-columns:12px minmax(0,1fr);gap:8px;align-items:baseline;font-size:.86rem;line-height:1.45}
.fl-r .sw{width:10px;height:10px;transform:rotate(45deg);align-self:center}
.eff .res{font-family:var(--f-data);font-size:.78rem;padding:0 .35rem;border:1px solid currentColor}
.eff .res.win{color:var(--good)} .eff .res.loss{color:var(--bad)} .eff .res.draw{color:var(--warn)}
.armsrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) 5.2rem;gap:6px;margin:6px 0}
.armsrow input{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:2px;padding:.4rem .5rem;min-height:40px;width:100%;font-variant-numeric:tabular-nums}
.deals{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.fire{display:flex;flex-direction:column;gap:6px}
.fire-r{display:grid;grid-template-columns:minmax(8.5rem,auto) minmax(0,1fr);gap:8px;align-items:center;font-size:.84rem;line-height:1.4}
.pick:disabled{opacity:.5;cursor:not-allowed}
.pick:disabled:hover{border-color:var(--line);background:transparent}
.packinfo{display:flex;flex-direction:column;gap:3px;padding:8px 10px;border:1px dashed var(--line);font-size:.86rem;line-height:1.45}
.cond{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 4px}
.cond span{font-size:.74rem;border:1px solid var(--warn);color:var(--ink);padding:0 .4rem}
.deal{display:flex;flex-direction:column;gap:5px;padding:8px 10px;border:1px solid var(--line);border-left:3px solid var(--warn);font-size:.9rem;line-height:1.45}
.deal.agreed{border-left-color:var(--good)}
.deal .st{font-family:var(--f-data);font-size:.7rem;letter-spacing:.08em;color:var(--ink-2)}
.terms{margin-top:8px;padding:8px 10px;border:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.fi-deliv{border-left:3px solid var(--good)}
.ally-row{width:100%;background:none;border:0;border-top:1px dashed var(--line);color:inherit;font:inherit;text-align:left;padding:6px 0;cursor:pointer;min-height:36px}
.ally-row:hover .wo-l,.ally-row.sel .wo-l{color:var(--accent);text-decoration:underline}
.ally-note{margin:0 0 2px;line-height:1.4}
.ally-act{margin:2px 0 6px}
.money{display:flex;flex-direction:column;gap:8px;margin:6px 0 10px;padding:8px 10px;border:1px solid var(--line)}
.hcell.fund .v{font-size:1.1rem}
.mapsvg .pl{cursor:pointer}
.mapsvg .pl .hit,.mapsvg .un .hit{fill:transparent;pointer-events:all}
.mapsvg .pl .pd{stroke:var(--bg);stroke-width:2}
.mapsvg .pl.th .pd{fill:var(--sig)} .mapsvg .pl.op .pd{fill:var(--accent)} .mapsvg .pl.contested .pd{fill:var(--warn)} .mapsvg .pl.third .pd{fill:var(--ink-2);opacity:.5}
.mapsvg .pl .pn{fill:var(--ink);font-family:var(--f-body);font-size:15px;paint-order:stroke;stroke:var(--land);stroke-width:4px;stroke-linejoin:round}
.mapsvg .pl.sel .pd{stroke:var(--ink);stroke-width:3}
.mapsvg .pl .ring{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:4 3}
.mapsvg .un{cursor:pointer}
.mapsvg .un rect,.mapsvg .un path{stroke:var(--bg);stroke-width:1.5}
.mapsvg .un.th rect,.mapsvg .un.th path{fill:var(--sig)} .mapsvg .un.op rect,.mapsvg .un.op path{fill:var(--accent)}
.mapsvg .un .ux{fill:none;stroke:var(--bg);stroke-width:1.5}
.mapsvg .un .sb{fill:var(--seg-off);stroke:none} .mapsvg .un .sf{fill:var(--good);stroke:none}
.mapsvg .un.sel rect:first-of-type,.mapsvg .un.sel path:first-of-type{stroke:var(--ink);stroke-width:3}
.mapsvg .route{stroke-width:2;stroke-dasharray:5 4;opacity:.9} .mapsvg .route.th{stroke:var(--sig)} .mapsvg .route.op{stroke:var(--accent)}
.ur{display:grid;grid-template-columns:1.4rem minmax(0,1fr) 3.2rem;gap:6px;align-items:start;padding:5px 0;border-top:1px dashed var(--line);font-size:.86rem;line-height:1.4}
.ur .ug{font-size:1rem;line-height:1.3} .ur.th .ug{color:var(--sig)} .ur.op .ug{color:var(--accent)}
.ur .ui{display:flex;flex-direction:column;gap:4px;min-width:0}
.ur.th .bb i{background:var(--sig)} .ur.op .bb i{background:var(--accent)}
.ur .bb{height:5px;justify-content:flex-start}
.ur .us{font-family:var(--f-data);font-variant-numeric:tabular-nums;text-align:right}
.ur.sel{outline:1.5px solid var(--ink);outline-offset:2px}
.usel{font-size:.84rem;min-height:36px;padding:.2rem .4rem;width:100%}
.fi-fight{border-left:3px solid var(--warn)}
.fi-fight.win,.fi-fight.take{border-left-color:var(--good)} .fi-fight.loss,.fi-fight.lost{border-left-color:var(--bad)}
.ftab{margin:10px 0}
.ftab table{width:100%;border-collapse:collapse;font-size:.9rem}
.ftab th,.ftab td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v==null || v===false) continue;
    if(k==='class') el.className = v;
    else if(k==='text') el.textContent = v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if(v===true) el.setAttribute(k,'');
    else el.setAttribute(k, v);
  }
  for(const kid of kids.flat(Infinity)){
    if(kid==null || kid===false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
function prose(text){
  const box = h('div',{class:'prose'}); let ul = null;
  for(const raw of String(text||'').split('\n')){
    const line = raw.trim(); if(!line){ ul = null; continue; }
    const m = /^[•\-–*]\s+(.*)$/.exec(line);
    if(m){ if(!ul){ ul = h('ul'); box.append(ul); } ul.append(h('li',{text:m[1]})); }
    else { ul = null; box.append(h('p',{text:line})); }
  }
  return box;
}

/* "next event": move the clock straight to the next thing that will happen, for a player with nothing to add */
function nextStop(g){
  const m = minute(g), wait = g.pace === 'fast' ? 2 : 3;
  let t = g.queue.length ? g.queue[0].t : g.ladder.length ? (g.nextLadder != null ? g.nextLadder : m + wait) : m + 3;
  let kind = (g.queue.length || g.ladder.length) ? 'event' : 'quiet';
  const due = g.dec.filter(d => d.state === 'open').map(d => d.dueM).sort((a,b) => a - b)[0];
  const me = scn(g.sid).pure ? nextMapEvent(g) : null; if(me != null && me < t){ t = me; kind = 'event'; }
  if(due != null && due <= t){ t = due; kind = 'miss'; }
  if(t >= g.dur){ t = g.dur; kind = (g.auto && g.dur < g.cap) ? 'quiet' : 'end'; }
  return { t: Math.max(t, m), kind };
}
function skipNext(){
  if(!G || G.phase !== 'run' || !ui || flight) return;
  const g = G, n = nextStop(g);
  /* letting a deadline pass or ending the game takes a second tap */
  if((n.kind === 'miss' || n.kind === 'end') && ui.skipArm !== n.kind){ ui.skipArm = n.kind; ui.skipAt = performance.now(); paintPause(); return; }
  ui.skipArm = null;
  if(!g.queue.length && g.ladder.length && n.kind !== 'miss') g.nextLadder = Math.min(n.t, g.dur);
  g.el = Math.max(g.el, n.t * 60000 + 30); lastT = performance.now(); dirty = true;
  step(g);
  if(G !== g || g.phase !== 'run') return;
  paintClock(); paintDecs(false); paintPause(); persist(false);
}
function paintPause(){

  ui.pause.hidden = !run; ui.pause.textContent = paused ? 'เดินเวลาต่อ' : 'หยุดเวลา';
  ui.pause.classList.toggle('primary', paused); ui.pause.setAttribute('aria-pressed', String(paused));
  ui.next.hidden = !run; ui.next.disabled = !!flight;
  ui.next.textContent = flight ? 'รอผลคำสั่งอยู่' : ui.skipArm === 'miss' ? 'ยืนยัน: ปล่อยพ้นเส้นตาย' : ui.skipArm === 'end' ? 'ยืนยัน: ข้ามไปจบเกม' : 'เหตุการณ์ถัดไป';
  ui.next.classList.toggle('danger', !flight && !!ui.skipArm);

  ui.taLabel.textContent = paused ? 'คำสั่งของคุณ · เวลาหยุดอยู่ พิมพ์ได้ตามสบาย' : autoPause ? 'คำสั่งของคุณ · เวลาหยุดให้ตราบที่มีข้อความในช่องนี้' : 'คำสั่งของคุณ · เวลายังเดินอยู่';
  paintClock();

/* ---------- saving: this browser at once, the viewer's account on real changes ---------- */
function pack(g){
  const c = JSON.parse(JSON.stringify(g));
  let d = ui && ui.ta ? ui.ta.value : draft;
  if(flight && G === g){ c.feed = c.feed.filter((f,i) => g.feed[i] !== flight.item); d = flight.text + (d && d.trim() ? '\n' + d : ''); }
  c.draft = g.phase==='run' ? String(d||'').slice(0,MAX_ORDER) : '';
  c.updatedAt = Date.now();
  return c;
}
function unpack(doc){
  try{
    if(!doc || doc.v!==3 || !doc.id || !Array.isArray(doc.feed) || !Array.isArray(doc.queue) || !doc.stats) return null;
    const g = JSON.parse(JSON.stringify(doc)); delete g.draft; delete g.updatedAt;
    if(g.phase==='opening') return null;
    g.ladder = Array.isArray(g.ladder) ? g.ladder : []; g.dec = Array.isArray(g.dec) ? g.dec : [];
    g.hist = Array.isArray(g.hist) ? g.hist : []; g.cover = (g.cover && typeof g.cover==='object') ? g.cover : {}; g.sit = g.sit || null; fillWar(g);
    return g;
  }catch(e){ return null; }
}
function writeLocal(){
  /* the browser keeps up to 6 games; when storage is full, older games drop first so the game on screen is always kept */
  const list = [...saves.values()].sort((a,b) => (b.updatedAt||0)-(a.updatedAt||0)), cur = G ? saves.get(G.id) : null;
  for(let n = Math.min(6, list.length); n >= 1; n--){
    let keep = list.slice(0, n); if(cur && !keep.includes(cur)) keep = [cur].concat(keep.slice(0, n - 1));
    try{ localStorage.setItem(LS_KEY, JSON.stringify(keep)); return; }catch(e){}
  }
}
function readLocal(){
  try{ const arr = JSON.parse(localStorage.getItem(LS_KEY)||'[]'); if(Array.isArray(arr)) arr.forEach(d => { if(d && d.v===3 && d.id) saves.set(String(d.id), d); }); }catch(e){}
}
function saveLabel(){
  return cloud.state==='saving' ? 'กำลังบันทึกเข้าบัญชีของคุณ' :

         cloud.state==='full'   ? 'พื้นที่บันทึกในบัญชีเต็ม เกมนี้บันทึกไว้ในเบราว์เซอร์นี้เท่านั้น' :
                                  'บันทึกไว้ในเบราว์เซอร์นี้แล้ว ออกจากหน้านี้เมื่อไร นาฬิกาจะหยุดรอ';
}
function paintSaveState(){ if(ui && ui.save) ui.save.textContent = saveLabel(); }
/* the store takes at most 256 KiB per document; a long game keeps its feed in numbered part documents under the game */
const PART_MAX = 180000;
const enc = new TextEncoder();
const jsonBytes = o => enc.encode(JSON.stringify(o)).length;
const partsOf = id => cloud.col.doc(id).collection('parts');
function splitDoc(doc){
  if(jsonBytes(doc) <= PART_MAX) return { main:doc, parts:[] };
  const parts = []; let cur = [], size = 0;
  for(const f of doc.feed){ const b = jsonBytes(f) + 1; if(cur.length && size + b > PART_MAX){ parts.push(cur); cur = []; size = 0; } cur.push(f); size += b; }
  if(cur.length) parts.push(cur);
  return { main:Object.assign({}, doc, { feed:[], parts:parts.length }), parts };
}
async function pushCloud(id, retried){
  if(!cloud.ready) return;
  if(cloud.busy.has(id)){ cloud.dirty.add(id); return; }
  const doc = saves.get(id); if(!doc) return;
  cloud.busy.add(id); cloud.state = 'saving'; paintSaveState();
  let again = false;
  try{
    const { main, parts } = splitDoc(doc), sent = cloud.sent.get(id) || [], strs = parts.map(p => JSON.stringify(p)), had = cloud.nparts.get(id) || 0;
    /* parts first, then the game: a reader never finds a game whose parts are missing */
    for(let i = 0; i < parts.length; i++) if(sent[i] !== strs[i]){ await partsOf(id).doc('p' + i).set({ i, feed:parts[i] }); sent[i] = strs[i]; cloud.sent.set(id, sent); }
    await cloud.col.doc(id).set(main);
    for(let i = parts.length; i < had; i++) await partsOf(id).doc('p' + i).delete();
    cloud.sent.set(id, strs); cloud.nparts.set(id, parts.length); cloud.state = 'saved';
  }
  catch(e){
    const code = e && e.code;
    if(code==='unavailable' && !retried) again = true;
    else if(code==='quota_exceeded') cloud.state = 'full';
    else if(code==='resource_exhausted' || code==='invalid_argument') cloud.state = 'local';
    else { cloud.ready = false; cloud.state = 'local'; }
  }
  cloud.busy.delete(id); paintSaveState();
  if(again) setTimeout(() => pushCloud(id, true), 1500 + Math.random()*1500);
  else if(cloud.dirty.delete(id)) pushCloud(id);
}
async function loadParts(id, x){
  const n = Number(x.parts) || 0; if(!n) return x;
  const snap = await partsOf(id).get(), byI = [];
  snap.docs.forEach(d => { const p = d.data(); if(p && Array.isArray(p.feed) && Number(p.i) < n) byI[Number(p.i)] = p.feed; });
  for(let i = 0; i < n; i++) if(!byI[i]) return null;
  const c = Object.assign({}, x, { feed:[].concat(...byI) }); delete c.parts;
  cloud.sent.set(id, byI.map(p => JSON.stringify(p)));
  return c;
}
function persist(toCloud){
  if(!G || G.phase==='opening') return;
  const doc = pack(G); saves.set(doc.id, doc); writeLocal(); dirty = false; lastLocal = performance.now();
  if(toCloud) pushCloud(doc.id);
}
function removeGame(id){
  saves.delete(id); writeLocal(); cloud.sent.delete(id); cloud.nparts.delete(id);
  if(cloud.ready){
    try{ cloud.col.doc(id).delete().catch(() => {}); }catch(e){}
    try{ partsOf(id).get().then(s => s.docs.forEach(d => partsOf(id).doc(d.id).delete().catch(() => {}))).catch(() => {}); }catch(e){}
  }
}
async function initCloud(){
  if(!hasClaude) return;
  let db, user;
  try{ [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); }catch(e){ return; }
  if(!db || !user) return;
  let snap;
  try{
    const uid = await user.id(); if(!uid) return;
    cloud.col = db.collection('data/users/' + uid);
    snap = await cloud.col.orderBy('updatedAt','desc').limit(20).get();
  }catch(e){ return; }
  cloud.ready = true; cloud.state = 'saved';
  const remote = new Map();
  snap.docs.forEach(d => { const x = d.data(); if(x && x.v===3){ const c = JSON.parse(JSON.stringify(x)); c.id = d.id; remote.set(d.id, c); cloud.nparts.set(d.id, Number(c.parts) || 0); } });
  for(const [id, x] of remote){
    if(G && G.id===id) continue;
    const mine = saves.get(id); if(mine && (x.updatedAt||0) <= (mine.updatedAt||0)) continue;
    let full = null; try{ full = await loadParts(id, x); }catch(e){}
    if(full) saves.set(id, full);
  }
  saves.forEach((x,id) => { const r = remote.get(id); if(!r || (r.updatedAt||0) < (x.updatedAt||0)) pushCloud(id); });
  writeLocal(); paintSaveState(); if(!G) render();
}
async function keepAwake(){

}

/* ---------- actions ---------- */
async function start(){
  if(starting) return; starting = true; notice = null;
  resetHelp(); resetSit(); paused = false; const g = G = blankGame(setup); useTheater(scn(g.sid)); HPM = g.hpm || 1; draft = ''; copyText = null; render();
  try{
    const text = await askLang(g, buildOpen(g), { tier:'default', onCtl:c => { openCtl = c; },
      onText: ({text}) => { if(G === g && ui && ui.openMsg){ const n = (text.match(/^\s*\{/gm)||[]).length; ui.openMsg.textContent = n ? `ผู้คุมเกมเตรียมเหตุการณ์แล้ว ${n} รายการ` : 'ผู้คุมเกมกำลังวางโจทย์'; } } }, t => parseGM(t).BRIEF);
    if(G !== g) return;
    const sec = parseGM(text), inj = parseInjects(sec.INJECTS);
    if(inj.length < 3) throw {code:'format'};
    g.brief = sec.BRIEF || ''; applyDom(g, parseObj(sec.DOMAINS)); applyWarOpen(g, sec);
    g.queue = schedule(g, inj, 0);
    g.ladder = parseInjects(sec.LADDER).map(x => { delete x.ask; delete x.due; delete x.miss; delete x.mmd; delete x.opts; x.t = 0; return x; });
    g.feed.push({ k:'sys', m:0, body:g.brief });
    g.phase = 'run'; g.el = 0; lastT = performance.now();
    persist(true); render(); keepAwake();
  }catch(e){
    if(G === g){ G = null; if(!e || e.code !== 'cancelled') notice = copyFor(e && e.code); render(); }
  }finally{ starting = false; openCtl = null; }
}
async function sendOrder(){
  if(!G || G.phase!=='run' || flight || !ui) return;
  const text = ui.ta.value.trim().slice(0, MAX_ORDER); if(!text) return;
  const g = G, m0 = minute(g);
  const item = { k:'order', m:m0, text };
  g.feed.push(item); flight = { text, item, t0:performance.now(), ctl:null };
  ui.ta.value = ''; draft = '';
  paintFeed(); paintDesk(); persist(true);
  const fast = g.speed === 'fast';
  try{
    const reply = await askLang(g, buildOrder(g, text, m0), { tier: fast ? 'quick' : 'default', effort: fast ? undefined : 'low', onCtl:c => { if(flight && flight.item === item) flight.ctl = c; } }, t => { const x = parseGM(t); return (x.VERDICT||'') + ' ' + (x.RESULT||''); });
    if(G !== g || g.phase !== 'run') return;
    const sec = parseGM(reply);
    if(!sec.RESULT && !sec.VERDICT) throw {code:'format'};
    const d = parseDelta(sec.DELTA); applyDelta(g, d, 3); applyDom(g, parseObj(sec.DOMAINS)); const war = applyWarReply(g, sec), eff = war.eff;
    const ids = (sec.RESOLVED || '').match(/e\d+/g) || [], done = [];
    const now = minute(g);
    g.dec.forEach(x => { if(x.state==='open' && ids.includes(x.id)){ x.state = 'done'; x.doneM = now; done.push(x.title); } });
    const cov = [...new Set(((sec.COVERS || '').match(/[a-z]+/g) || []).filter(c => DOMS[c]))]; cov.forEach(c => { g.cover[c] = (g.cover[c]||0) + 1; });
    g.feed.push({ k:'verdict', m:now, verdict:sec.VERDICT||'', result:sec.RESULT||'', delta:d, done, cov, eff, loss:war.loss, use:war.use, ally:war.ally, allyAns:war.allyAns, battles:war.battles, arms:war.arms }); cue('ok');
    const inj = parseInjects(sec.INJECTS); if(inj.length) g.queue = schedule(g, inj, now);
    g.orders++; g.nextLadder = null;
  }catch(e){
    if(G === g){
      item.void = true;
      const cancelled = e && e.code === 'cancelled';
      if(g.phase === 'run'){
        g.feed.push({ k:'sys', m:minute(g), void:true, body: cancelled ? 'ยกเลิกคำสั่งล่าสุดแล้ว ข้อความกลับไปอยู่ในช่องพิมพ์' : `คำสั่งล่าสุดไปไม่ถึงผู้คุมเกม ${copyFor(e && e.code)} ข้อความกลับไปอยู่ในช่องพิมพ์` });
        if(ui && ui.ta){ ui.ta.value = text + (ui.ta.value.trim() ? '\n' + ui.ta.value : ''); draft = ui.ta.value; }
      }
    }
  }finally{
    if(flight && flight.item === item) flight = null;
    if(G === g && g.phase === 'run'){ const we = warEnd(g); if(we){ endGame(g, we); return; } paintFeed(!!item.void); paintMap(); paintStatus(); paintDecs(true); paintDesk(); persist(true); }
  }
}
async function debrief(){
  if(!G || G.phase!=='over' || flight) return;
  const g = G; notice = null; flight = { text:'', item:null, t0:performance.now(), ctl:null, final:true }; paintDesk();
  try{
    const text = await askLang(g, buildFinal(g), { tier:'default', onCtl:c => { if(flight) flight.ctl = c; } }, t => parseGM(t).ENDING);
    if(G !== g) return;
    const sec = parseGM(text); if(!(sec.GRADE || sec.ENDING)) throw {code:'format'};
    g.final = pickFinal(sec); g.phase = 'done';
  }catch(e){ if(G === g && (!e || e.code !== 'cancelled')) notice = copyFor(e && e.code); }
  finally{ flight = null; if(G === g){ persist(true); render(); } }
}

async function askHelp(){
  if(!G || G.phase!=='run' || help.busy || !ui) return;
  const g = G; help = {busy:true, items:null, err:null, ctl:null}; paintHelp();
  const mine = help;
  try{
    const text = await askLang(g, buildHelp(g), { tier:'quick', onCtl:c => { mine.ctl = c; } }, noKeys);
    if(G !== g || help !== mine) return;
    const items = [];
    for(const line of text.split('\n')){
      const a = line.indexOf('{'), b = line.lastIndexOf('}'); if(a<0 || b<=a) continue;
      try{ const o = jparse(line.slice(a,b+1)); const order = String(o.order||'').trim();
        if(order) items.push({ label:String(o.label||'').trim().slice(0,80), order:order.split(/\s+\/\s+/).join('\n').slice(0,900), risk:String(o.risk||'').trim().slice(0,300) }); }catch(e){}
    }

function transcript(){
  const s = scn(G.sid), L = [];
  L.push(`ห้องวิกฤต: ${s.name} (${s.sub})`, `บทบาท: ${s.role}${s.pure ? ' · ฝ่าย' + sideOf(G).pTh : ''}`, `ความยาว: ${G.dur} นาที`, '');
  for(const f of G.feed){
    const T = `[${gameClock(f.m)} | นาทีที่ ${f.m.toFixed(1)}]`;
    if(f.k==='sys' || f.k==='note') L.push(`${T} ${f.body}`);
    else if(f.k==='inj') L.push(`${T} ${DOMS[f.d]} · ${REL[f.rel][1]} · ${f.title}: ${f.body}${f.ask ? ' ต้องตัดสินใจ: ' + f.ask : ''}`);
    else if(f.k==='order') L.push(`${T} คำสั่ง${f.void ? ' (ไม่ถูกดำเนินการ)' : ''}: ${f.text}`);
    else if(f.k==='verdict') L.push(`${T} ผลของคำสั่ง: ${f.verdict} ${f.result}`);
    else if(f.k==='miss') L.push(`${T} พ้นกำหนด: ${f.title}. ${f.miss}`);
    else if(f.k==='deliv') L.push(`${T} ส่งมอบอาวุธ: ${dealText(f.deal)}`);
    else if(f.k==='fight') L.push(`${T} แผนที่การรบ: ${f.text}`);
    L.push('');
  }
  if(G.final){ const f = G.final; L.push(`ผลประเมิน: ${f.grade}`, f.ending, '', 'รายมิติ:', f.bydomain, '', 'รูปแบบการตัดสินใจ:', f.patterns, '', 'ดีที่สุด: '+f.best, 'แย่ที่สุด: '+f.worst, '', f.real); }
  L.push('', 'ค่าสถานะสุดท้าย: ' + KEYS.map(k => `${s.tracks[k].l} ${G.stats[k]}/10`).join(', '));
  return L.join('\n');
}

/* ---------- map geometry: a schematic, not a boundary reference ---------- */
const MAPW = 660, MAPH = 540;

const SVGNS = 'http://www.w3.org/2000/svg';
function svg(tag, attrs, ...kids){
  const el = document.createElementNS(SVGNS, tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){ if(v==null || v===false) continue; if(k.startsWith('on')) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v); }
  for(const kid of kids.flat(Infinity)){ if(kid==null || kid===false) continue; el.append(kid.nodeType ? kid : document.createTextNode(String(kid))); }
  return el;
}
const pts = arr => arr.map(p => px(p[0],p[1]).join(',')).join(' ');
function buildMap(s){
  const T = THEATRE, key = T.key || 'kh';
  const root = svg('svg',{class:'mapsvg',viewBox:`0 0 ${MAPW} ${MAPH}`,role:'group','aria-label':'แผนที่ยุทธบริเวณ'});
  root.append(svg('path',{class:'land',d:T.ot}), svg('path',{class:'land th',d:T.th}), svg('path',{class:'land op',d:T.op}));
  const step = T.k < 70 ? 2 : 1, lonMax = T.lon0 + MAPW / T.k, latMin = T.lat0 - MAPH / T.k;
  for(let lon = Math.ceil(T.lon0 / step) * step; lon < lonMax; lon += step){ const [x] = px(0,lon); if(x < 8) continue; root.append(svg('line',{class:'grat',x1:x,y1:0,x2:x,y2:MAPH}), svg('text',{class:'gl',x:x+4,y:MAPH-6}, lon+'°E')); }
  for(let lat = Math.ceil(latMin / step) * step; lat < T.lat0; lat += step){ const [,y] = px(lat,0); if(y > MAPH - 24) continue; root.append(svg('line',{class:'grat',x1:0,y1:y,x2:MAPW,y2:y}), svg('text',{class:'gl',x:4,y:y-4}, lat+'°N')); }
  if(T.other) root.append(svg('path',{class:'brd2',d:T.other}));
  if(T.front) root.append(svg('path',{class:'brd',d:T.front}));
  if(s.id==='sea'){ root.append(svg('polygon',{class:'oca',points:pts(OCA)})); const [x,y] = px(10.25,101.7); root.append(svg('text',{class:'cl',x,y}, 'พื้นที่อ้างสิทธิ์ทับซ้อน')); }
  (MAPLBL[key] || []).forEach(c => { const [x,y] = px(c[1],c[2]); root.append(svg('text',{class:'cty',x,y,'font-style':c[3]||null,'text-anchor':c[4]||null}, c[0])); });
  (MAPCITY[key] || []).forEach(k => { const P = PLACES[k], [x,y] = px(P[1],P[2]); root.append(svg('rect',{class:'city',x:x-4,y:y-4,width:8,height:8}), svg('text',{class:'cl',x:x+P[4],y:y+P[5],'text-anchor':P[6]}, P[0])); });
  const sc = svg('g',{id:'mapscam'});
  if(s.scam) SCAM.forEach(([code, note]) => {
    const P = PLACES[code], [x0,y0] = px(P[1],P[2]), x = x0 - 13, y = y0 - 13;
    const go = () => { if(ui && ui.mapNote) ui.mapNote.textContent = 'แหล่งสแกมตามรายงาน · ' + note; };
    sc.append(svg('g',{class:'sc',tabindex:'0',role:'button','aria-label':'แหล่งสแกมตามรายงาน ' + note,onclick:go,onkeydown:ev => { if(ev.key==='Enter' || ev.key===' '){ ev.preventDefault(); go(); } }},
      svg('circle',{class:'hit',cx:x,cy:y,r:15}), svg('rect',{class:'dia',x:x-6,y:y-6,width:12,height:12,transform:`rotate(45 ${x} ${y})`})));
  });
  const front = svg('g',{id:'mapfront'}); root.append(front);
  const layer = svg('g',{id:'mapmk'}); root.append(layer);
  root.append(sc);
  return {root, layer, front};
}

let actx = null, muted = false;
try{ muted = localStorage.getItem('crisisroom.mute') === '1'; }catch(e){}
function initAudio(){ try{ if(!actx){ const C = window.AudioContext || window.webkitAudioContext; if(C) actx = new C(); } if(actx && actx.state === 'suspended') actx.resume(); }catch(e){} }
function beep(f, d, when, vol){
  if(muted || !actx) return;
  try{ const t = actx.currentTime + (when||0), o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(vol||0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + 0.03); }catch(e){}
}
function cue(kind){
  if(kind==='dec'){ beep(880,.12); beep(1175,.16,.15); }
  else if(kind==='hot'){ beep(660,.09); beep(660,.09,.16); }
  else if(kind==='ok'){ beep(520,.12); }
  else if(kind==='miss'){ beep(220,.35,0,.07); }
  else if(kind==='end'){ beep(392,.25); beep(294,.5,.28); }
}

/* ---------- intelligence staff: a situation estimate on request ---------- */
let sit = {busy:false, err:null, ctl:null};
const resetSit = () => { if(sit.ctl) sit.ctl.abort(); sit = {busy:false, err:null, ctl:null}; };
function buildSit(g){
  return `${buildCommon(g)}

STORY SO FAR (what the player has seen, in order)
${story(g)}

${stateBlock(g, true)}

For this one reply you are not the assessor. You are the head of the player's intelligence staff. Use only what the player has seen. Give an estimate, not certainty, and say plainly where you could be wrong. Stay at the level of policy and command decisions (rule 10).
Reply with exactly one JSON object and no other text:
{"summary":"two sentences: where things stand right now","threats":["the three most urgent threats, most urgent first, one short sentence each"],"blind":["one to three things the player has neglected or not answered"],"likely":"the other side's most likely next move, one sentence","dangerous":"the other side's most dangerous possible move, one sentence","doubt":["one or two reports that deserve doubt, each with the reason"]${scn(g.sid).war ? ',"edges":[{"dim":"econ","lead":"th","text":"how the side with the advantage in this dimension can turn it into results now, how long that takes, and what limits it"}]' : ''}}${scn(g.sid).war ? '\nIn "edges" give three to five objects for the dimensions that matter most now (dim: land, sea, air, cyber, info, econ, will or intl; lead: th, op or even).' : ''}${langLine(g)}`;
}
async function askSit(){
  if(!G || G.phase!=='run' || sit.busy || !ui) return;
  const g = G; sit = {busy:true, err:null, ctl:null}; const mine = sit; paintSit();
  try{
    const text = await askLang(g, buildSit(g), { tier:'quick', onCtl:c => { mine.ctl = c; } }, noKeys);
    if(G !== g || sit !== mine) return;
    const o = parseObj(text), arr = x => (Array.isArray(x) ? x : []).map(y => String(y).trim().slice(0,300)).filter(Boolean).slice(0,3);
    if(!o.summary) throw {code:'format'};
    g.sit = { m:minute(g), summary:String(o.summary).slice(0,500), threats:arr(o.threats), blind:arr(o.blind), likely:String(o.likely||'').slice(0,300), dangerous:String(o.dangerous||'').slice(0,300), doubt:arr(o.doubt) };
    const ed = cleanEdges(o.edges); if(ed.length) g.edges = ed;
    sit = {busy:false, err:null, ctl:null}; dirty = true;
  }catch(e){ if(G === g && sit === mine) sit = {busy:false, err:(e && e.code==='cancelled') ? null : copyFor(e && e.code), ctl:null}; }
  finally{ if(G === g){ paintSit(); paintEdges(); } }
}

/* ---------- rendering: control screen, built once, then painted in place ---------- */
const ALERT = ['ปกติ','เฝ้าระวัง','ตึงเครียด','อันตราย','วิกฤต'];
function view(){
  if(ui && ui.viewM != null && G.hist && G.hist[ui.viewM]){
    const hs = G.hist[ui.viewM], stats = {}, dom = {};
    KEYS.forEach((k,i) => stats[k] = hs.s[i]); BOARD.forEach((k,i) => dom[k] = hs.d[i]);
    const bal = G.bal, world = G.world;
    const vb = hs.b ? { th:Object.fromEntries(DIMK.map((k,i) => [k, hs.b[i]])), op:Object.fromEntries(DIMK.map((k,i) => [k, hs.b[4+i]])) } : bal;
    const vw = hs.w ? Object.fromEntries(AUDK.map((k,i) => [k, hs.w[i]])) : world;
    return { live:false, m:ui.viewM, stats, dom, toll:{dead:hs.t[0], displaced:hs.t[1]}, bal:vb, world:vw, status:hs.st != null ? hs.st : G.status };
  }
  return { live:true, m:minute(G), stats:G.stats, dom:G.dom, toll:G.toll, bal:G.bal, world:G.world, status:G.status };
}
function stateOf(tr, v){ const b = tr.dir==='low' ? v : 10 - v; return b<=3 ? ['good','●','ปกติ'] : b<=6 ? ['warn','▲','เฝ้าระวัง'] : ['bad','■','วิกฤต']; }
function sparkline(k, upto){
  const idx = KEYS.indexOf(k), hist = (G.hist||[]).slice(0, upto+1);
  if(hist.length < 2) return null;
  const el = svg('svg',{class:'spark',viewBox:`0 0 ${Math.max(G.dur,1)} 10`,preserveAspectRatio:'none',role:'img','aria-label':'แนวโน้มตั้งแต่ต้นเกม'});
  el.append(svg('polyline',{points:hist.map((x,i) => `${i},${(10 - x.s[idx]).toFixed(1)}`).join(' ')}));
  return el;
}
function meter(s, k, v, mini, upto){
  const tr = s.tracks[k], [cls,mk,word] = stateOf(tr, v);
  const segs = h('div',{class:'segs '+cls, role:'img', 'aria-label':`${tr.l} ${v} จาก 10 ${word}`});
  for(let i=1;i<=10;i++) segs.append(h('i',{class:i<=v?'on':''}));
  return h('div',{class:'meter'},
    h('div',{class:'meter-top'}, mini ? h('span',{class:'meter-short',text:(SHORT[s.id]||s.short||{})[k]||tr.l}) : h('span',{class:'meter-label',text:tr.l}), h('span',{class:'meter-val'}, h('b',{text:String(v)}), '/10')),
    segs,
    h('div',{class:'meter-foot'},
      h('span',{class:'state '+cls}, h('span',{class:'mk-s','aria-hidden':'true',text:mk}), h('b',{text:word}), mini ? null : (' · '+(tr.dir==='low'?'ยิ่งต่ำยิ่งดี':'ยิ่งสูงยิ่งดี'))),
      mini ? null : sparkline(k, upto)));
}
function deltaChips(s, d){
  const box = h('div',{class:'chips'});
  KEYS.forEach(k => { const v = d && d[k]; if(!v) return; const good = (s.tracks[k].dir==='low') ? v<0 : v>0;
    box.append(h('span',{class:'chip '+(good?'up':'down')}, s.tracks[k].l+' ', h('b',{text:fmtD(v)}), good?' ดีขึ้น':' แย่ลง')); });
  return box.childNodes.length ? box : null;
}
function verdictList(text){
  const ul = h('ul',{class:'verdict'});

  ui.assist.hidden = !run; ui.quick.hidden = !run; if(ui.postWrap) ui.postWrap.hidden = !run; if(ui.armsWrap) ui.armsWrap.hidden = !run; paintArms(); paintPosture(); paintHelp(); paintSit(); paintDock();
  ui.deskNotice.hidden = !notice; if(notice) ui.deskNotice.replaceChildren(h('b',{text:'ยังไม่ได้ผล '}), notice);
  paintFlight();
  const end = [];
  if(G.phase==='opening') end.push(h('p',{class:'muted',text:'เมื่อโจทย์มาถึง นาฬิกาจะเริ่มเดินทันที อ่านฟีด ดูแผนที่ แล้วพิมพ์คำสั่งที่นี่'}),
    h('button',{class:'btn quiet',id:'btn-abort',onclick:goHome},'ยกเลิกและกลับหน้าหลัก'));
  if(G.phase==='over'){ const et = endTitle(G, s); end.push(h('p',{class:'eyebrow',text:et[0]}), h('h2',{text:et[1]}), et[2] ? h('p',{text:et[2]}) : null,
    h('button',{class:'btn primary',id:'btn-debrief',disabled:!!flight,onclick:debrief},'ดูบทสรุปและผลประเมิน')); }
  if(G.phase==='done' && G.final){
    end.push(h('p',{class:'eyebrow',text:'เกมจบแล้ว'}), h('h2',{text:`ผลประเมิน ${G.final.grade}`}),
      h('p',{class:'small muted',text:'บทสรุปอยู่บนสุดของฟีด ใช้แถบเล่นย้อนหลังใต้แผนที่เพื่อดูว่าสถานการณ์เปลี่ยนตอนไหน'}),
      h('button',{class:'btn',id:'btn-copy',onclick:ev => { const t = transcript(); const done = () => { ev.target.textContent = 'คัดลอกแล้ว'; };
        try{ navigator.clipboard.writeText(t).then(done).catch(() => { copyText = t; paintDesk(); }); }catch(err){ copyText = t; paintDesk(); } }},'คัดลอกบันทึกเกม'),
      h('button',{class:'btn primary',id:'btn-new',onclick:goHome},'กลับหน้าหลักเพื่อเริ่มเกมใหม่'));
    if(copyText){ const box = h('textarea',{class:'copybox',id:'copybox',readonly:true}); box.value = copyText; end.push(h('p',{class:'small muted',text:'คัดลอกอัตโนมัติไม่ได้ เลือกข้อความด้านล่างแล้วคัดลอกเอง'}), box); setTimeout(() => { box.focus(); box.select(); }, 0); }
  }
  ui.endBox.replaceChildren(...end.filter(Boolean)); ui.endBox.hidden = !end.length;
  ui.finalBox.replaceChildren(...(G.phase==='done' && G.final ? [finalPanel(s, G.final)] : []));
}
function render(){
  const app = document.getElementById('app'); if(!app) return;
  app.classList.toggle('playing', !!G); document.documentElement.classList.toggle('cr-playing', !!G);
  if(G){
    app.replaceChildren(buildGame());
    paintStatus(); paintMap(); paintFilters(); paintFeed(true); paintDecs(true); paintDesk(); paintReplay(); paintSaveState();
    if(G.phase==='over' || G.phase==='done') openDesk(true);
  } else { ui = null; app.replaceChildren(...renderHome()); }
}

/* ---------- boot ---------- */
function boot(data){
  readLocal();
  if(data && data.doc){ const g = unpack(data.doc); if(g){ G = g; draft = data.doc.draft || ''; lastT = performance.now(); } }
  render();
  initCloud();
  sampleP.then(sm => { if(!sm && !G && !notice){ notice = COPY.off; render(); } });
}
const hot = window.claude && window.claude.hot;
try{ if(hot && typeof hot.snapshot === 'function') hot.snapshot(() => (G && G.phase !== 'opening' ? {doc:pack(G)} : {})); }catch(e){}
if(hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
window.addEventListener('pagehide', () => { if(G && G.phase !== 'opening'){ const d = pack(G); saves.set(d.id, d); writeLocal(); } });
if(window.visualViewport){
  const vv = window.visualViewport;
  const upd = () => { document.documentElement.style.setProperty('--kb', Math.max(0, window.innerHeight - vv.height - vv.offsetTop).toFixed(0) + 'px'); };
  vv.addEventListener('resize', upd); vv.addEventListener('scroll', upd);
}
document.addEventListener('pointerdown', initAudio, {passive:true});
document.addEventListener('keydown', ev => { if(ev.key === 'Escape' && ui && G && G.phase === 'run') openDesk(false); });
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden'){ if(G && G.phase !== 'opening') persist(true); }
  else { lastT = performance.now(); keepAwake(); }
});
})();
</script>
